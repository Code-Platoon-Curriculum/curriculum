site_name: Full Stack Curriculum
theme:
  name: material
  logo: assets/home_logo.png
  favicon: assets/favicon.png
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    # Light mode
    - scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  font:
    text: Roboto Condensed
    code: Roboto Mono

  features:
    - content.code.copy
    - navigation.tabs
    - navigation.footer

extra:
  generator: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CodePlatoon/se-curriculum
    - icon: fontawesome/brands/slack
      link: https://codeplatoonteam.slack.com/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@CodePlatoon

nav:
  - Home: index.md
  - Installfest: Installfest
  - Phase I: 
    - Overview: phase-I/README.md
    - Fundamentals:
      - Overview: phase-I/01-Fundamentals/README.md
      - Docker:
        - Overview: phase-I/01-Fundamentals/1-docker/README.md
        - Intro to Docker: phase-I/01-Fundamentals/1-docker/1-intro-to-docker.md
        - Leveraging Docker: phase-I/01-Fundamentals/1-docker/2-leveraging-docker.md
        - Assignments: phase-I/01-Fundamentals/1-docker/assignments.md
      - Git & Github: phase-I/01-Fundamentals/2-git-and-github/README.md
      - JS & Python: phase-I/01-Fundamentals/3-js-and-python/README.md
    - OOP: phase-I/02-OOP/README.md
    - DS & Algorithms: phase-I:/03-DS-Algorithms/README.md
  - Phase II: phase-II
  - Phase III: phase-III
  - Phase IV: phase-IV
  - Phase V: phase-V
  - Additional Lectures: additional-lectures