site_name: Full Stack Curriculum
theme:
  name: material
  logo: assets/home_logo.png
  favicon: assets/favicon.png
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    # Light mode
    - scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  font:
    text: Roboto Condensed
    code: Roboto Mono

  features:
    - content.code.copy
    - navigation.tabs
    - navigation.footer

extra:
  generator: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CodePlatoon/se-curriculum
    - icon: fontawesome/brands/slack
      link: https://codeplatoonteam.slack.com/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@CodePlatoon

