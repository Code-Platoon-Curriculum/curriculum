site_name: Full Stack Curriculum
theme:
  name: material
  logo: assets/home_logo.png
  favicon: assets/favicon.png
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    # Light mode
    - scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  font:
    text: Roboto Condensed
    code: Roboto Mono

  features:
    - content.code.copy
    - navigation.tabs
nav:
  - Home: index.md
  - Installfest: Installfest
  - Phase I: Phase-I
  - Phase II: Phase-II
  - Phase III: Phase-III
  - Phase IV: Phase-IV
  - Phase V: Phase-V
  - Additional Lectures: additional-lectures